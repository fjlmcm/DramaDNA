[package]
name = "dramadna"
version = "0.1.14"
description = "短剧结构化拆解桌面客户端"
authors = ["DramaDNA contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "dramadna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
base64 = "0.23"
futures-util = "0.3"
